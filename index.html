<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Peony Hub - Morphing & Kinematics Architecture</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000102; font-family: sans-serif; }
        
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #hudCanvas { pointer-events: none; z-index: 5; }
        #webglCanvas { z-index: 1; }

        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(10, 20, 35, 0.75);
            border: 1px solid rgba(140, 180, 220, 0.4);
            color: #d0e5ff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(20, 40, 70, 0.9);
            border-color: #8cc0ff;
            box-shadow: 0 0 10px rgba(100, 180, 255, 0.3);
        }

        .btn.active {
            background: #255588;
            color: #ffffff;
            border-color: #aed5ff;
        }

        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(220, 235, 255, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(5, 10, 20, 0.6);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="hudCanvas"></canvas>

    <div id="ui">
        <button id="btnToggle" class="btn">POINTS MODE (M)</button>
        <button id="btnMorph" class="btn">MORPH: STATE A</button>
    </div>
    <div id="ui-overlay">Dark Peony Hub • MoGraph Morphing Architecture</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <script>
        // ==========================================
        // UTILS & NOISE
        // ==========================================
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function noise(u, seed = 0) {
            return Math.sin(u * 7.3 + seed) * 0.4 + Math.sin(u * 17.1 + seed * 2.0) * 0.35 + Math.cos(u * 31.7 + seed * 0.5) * 0.25;
        }

        // ==========================================
        // 2D HUD
        // ==========================================
        const hudCanvas = document.getElementById('hudCanvas');
        const hudCtx = hudCanvas.getContext('2d');

        function resizeHud() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            hudCanvas.width = window.innerWidth * dpr;
            hudCanvas.height = window.innerHeight * dpr;
            hudCtx.scale(dpr, dpr);
            drawHud();
        }

        function drawHud() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            hudCtx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const R = Math.min(w, h) * 0.38 * 1.25;

            hudCtx.lineWidth = 1.5;
            hudCtx.strokeStyle = 'rgba(100, 160, 220, 0.35)';
            hudCtx.beginPath();
            hudCtx.arc(cx, cy, R, 0, Math.PI * 2);
            hudCtx.stroke();

            const hGrad = hudCtx.createLinearGradient(0, cy, w, cy);
            hGrad.addColorStop(0.0, 'rgba(100, 170, 240, 0.0)');
            hGrad.addColorStop(0.2, 'rgba(100, 170, 240, 0.15)');
            hGrad.addColorStop(0.8, 'rgba(100, 170, 240, 0.15)');
            hGrad.addColorStop(1.0, 'rgba(100, 170, 240, 0.0)');
            hudCtx.strokeStyle = hGrad;
            hudCtx.beginPath();
            hudCtx.moveTo(0, cy); hudCtx.lineTo(w, cy);
            hudCtx.stroke();

            const vGrad = hudCtx.createLinearGradient(cx, 0, cx, h);
            vGrad.addColorStop(0.0, 'rgba(100, 170, 240, 0.0)');
            vGrad.addColorStop(0.15, 'rgba(100, 170, 240, 0.15)');
            vGrad.addColorStop(0.85, 'rgba(100, 170, 240, 0.15)');
            vGrad.addColorStop(1.0, 'rgba(100, 170, 240, 0.0)');
            hudCtx.strokeStyle = vGrad;
            hudCtx.beginPath();
            hudCtx.moveTo(cx, 0); hudCtx.lineTo(cx, h);
            hudCtx.stroke();
        }

        // ==========================================
        // SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5.6, 5.4);
        camera.lookAt(0, -0.48, 0);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false, 
            powerPreference: "high-performance",
            canvas: document.createElement('canvas') 
        });
        
        renderer.setClearColor(0x000102, 1.0);
        renderer.domElement.id = 'webglCanvas';
        document.body.appendChild(renderer.domElement);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        let isPointsMode = true;
        let morphState = 0.0; // 0.0 = State A (Peony), 1.0 = State B (Orbital Cloud / Target)
        let targetMorphState = 0.0;

        function createParticleTexture() {
            const size = 128; 
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, 'rgba(255,255,255,1.0)');
            gradient.addColorStop(0.25, 'rgba(200,230,255,0.7)');
            gradient.addColorStop(0.5, 'rgba(100,170,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0.0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture();

        const pointsMaterialConfig = {
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            depthTest: true
        };

        const meshGroup = new THREE.Group();
        const pointsGroup = new THREE.Group();
        scene.add(meshGroup, pointsGroup);
        const allMaterials = [];

        function getViewportScale() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            return (w >= h ? Math.min(w, h) : h) * 0.0012;
        }

        // ==========================================
        // SHADERS С АРХИТЕКТУРОЙ МОРФИНГА И ЗАВИХРЕНИЯ
        // ==========================================
        const sharedUniforms = {
            uTime: { value: 0 },
            uMorphProgress: { value: 0.0 }
        };

        const petalVertexPars = `
            uniform float uTime;
            uniform float uPhase;
            uniform float uAmpFactor;
            uniform float uFlexFactor;
            uniform float uSCurveStrength;
            uniform float uLayerTier;
            uniform float uMorphProgress;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec2 vUv;
            varying float vTier;
            attribute float aSizeScale;
            attribute vec3 aVolumetricOffset;
            attribute vec3 aTargetShapeState; // Целевые координаты для морфинга State B
        `;

        const petalVertexDisplacement = `
            vUv = uv;
            vTier = uLayerTier;
            vec3 pos = position;

            // Иерархический фазовый срыв (от краев к центру)
            float hMask = smoothstep(0.01, 1.0, vUv.y);
            float vNorm = vUv.y; 
            float uNorm = (vUv.x - 0.5) * 2.0;

            float cupDeep = sin(vNorm * 3.14159 * 0.75) * 0.48 * uSCurveStrength;
            float tipOut  = -pow(vNorm, 2.1) * 0.38 * uSCurveStrength;
            float baseSCurve = cupDeep + tipOut;

            float ruffleMask = smoothstep(0.1, 1.0, vNorm) * (0.3 + 0.7 * abs(uNorm));
            float transverseSine = sin(uNorm * 12.56 + uPhase * 1.5) * 0.08 * ruffleMask;

            float effectiveAmp = uAmpFactor * uFlexFactor;
            float whip = pow(vNorm, 1.25) * effectiveAmp;
            float wave1 = sin(uTime * 0.85 - vNorm * 3.8 + uPhase) * 0.35 * whip;
            float wave2 = cos(uTime * 0.62 - vNorm * 5.2 + uPhase * 1.7) * 0.18 * whip;
            
            pos.z += baseSCurve + transverseSine + wave1 * hMask;

            // 360° Орбитальное завихрение и морфинг в State B
            if (uMorphProgress > 0.001) {
                float angleOrb = uMorphProgress * 6.28318 + length(pos.xz) * 0.5;
                float cosA = cos(angleOrb);
                float sinA = sin(angleOrb);
                
                vec3 explodedPos = vec3(
                    pos.x * cosA - pos.z * sinA,
                    pos.y + uMorphProgress * 1.5 + sin(uTime + uPhase) * 0.2,
                    pos.x * sinA + pos.z * cosA
                );
                
                // Плавная интерполяция между State A (пион) и State B (облако / цель)
                vec3 target = mix(explodedPos, aTargetShapeState, smoothstep(0.0, 1.0, uMorphProgress));
                pos = mix(pos, target, uMorphProgress);
            }
        `;

        function createPetalMeshMat(pSeed, amp, flex, sStr, tier) {
            const mat = new THREE.ShaderMaterial({
                uniforms: { 
                    ...sharedUniforms,
                    uPhase: {value: pSeed}, uAmpFactor: {value: amp}, 
                    uFlexFactor: {value: flex}, uSCurveStrength: {value: sStr}, uLayerTier: {value: tier} 
                },
                vertexShader: `
                    ${petalVertexPars}
                    void main() {
                        ${petalVertexDisplacement}
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        vViewPosition = -mvPosition.xyz;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal, vViewPosition;
                    varying vec2 vUv;
                    varying float vTier;
                    void main() {
                        vec3 N = gl_FrontFacing ? normalize(vNormal) : -normalize(vNormal);
                        vec3 V = normalize(vViewPosition);
                        float fresnel = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), 1.5);
                        vec3 color = mix(vec3(0.02, 0.05, 0.1), vec3(0.75, 0.9, 1.0), fresnel * 1.2);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide, depthWrite: true, depthTest: true
            });
            allMaterials.push(mat); return mat;
        }

        function createPetalPointsMat(pSeed, amp, flex, sStr, tier) {
            const mat = new THREE.ShaderMaterial({
                ...pointsMaterialConfig,
                uniforms: { 
                    ...sharedUniforms,
                    uPhase: {value: pSeed}, uAmpFactor: {value: amp}, 
                    uFlexFactor: {value: flex}, uSCurveStrength: {value: sStr}, uLayerTier: {value: tier},
                    uTexture: {value: particleTexture}, uViewportScale: {value: getViewportScale()}, uSize: {value: 2.2} 
                },
                vertexShader: `
                    ${petalVertexPars}
                    uniform float uViewportScale, uSize;
                    varying float vAlpha, vFresnel;
                    void main() {
                        ${petalVertexDisplacement}
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        float dist = max(-mvPosition.z, 0.1);
                        vec3 N = normalize(normalMatrix * normal);
                        vec3 V = normalize(-mvPosition.xyz);
                        vFresnel = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), 1.3);
                        gl_PointSize = uSize * uViewportScale * (0.7 + aSizeScale * 0.5) / (0.35 + 0.06 * dist);
                        vAlpha = (0.2 + 0.5 * vFresnel) * (0.3 + 0.7 * smoothstep(0.0, 0.35, vUv.y));
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying float vAlpha, vFresnel;
                    void main() {
                        vec4 tex = texture2D(uTexture, gl_PointCoord);
                        if (tex.a < 0.01) discard;
                        vec3 color = mix(vec3(0.04, 0.1, 0.2), vec3(0.7, 0.88, 1.0), vFresnel * 1.1);
                        gl_FragColor = vec4(color, tex.a * vAlpha * 0.20);
                    }
                `
            });
            allMaterials.push(mat); return mat;
        }

        // ==========================================
        // ГЕНЕРАЦИЯ ГЕОМЕТРИИ И ЗАПУСК
        // ==========================================
        const FLOWER_SCALE = 0.72;
        meshGroup.scale.set(FLOWER_SCALE, FLOWER_SCALE, FLOWER_SCALE);
        pointsGroup.scale.set(FLOWER_SCALE, FLOWER_SCALE, FLOWER_SCALE);
        meshGroup.position.y = -0.55;
        pointsGroup.position.y = -0.55;

        function createPetalGeometries(length, maxWidth, seed) {
            const segX = 40, segY = 40; // Оптимизировано для стабильного FPS
            const baseGeo = new THREE.PlaneGeometry(maxWidth, length, segX, segY);
            baseGeo.translate(0, length / 2, 0);
            const posAttr = baseGeo.attributes.position;
            const baseCount = posAttr.count;

            const targetShapeAttr = new Float32Array(baseCount * 3);
            for (let i = 0; i < baseCount; i++) {
                let x = posAttr.getX(i), y = posAttr.getY(i), z = posAttr.getZ(i);
                // Генерация целевых координат для State B (например, разброс в сферу/орбиту)
                const phi = seededRandom(i * 1.3) * Math.PI * 2;
                const costheta = seededRandom(i * 2.1) * 2 - 1;
                const theta = Math.acos(costheta);
                const rTarget = 2.5 + seededRandom(i * 3.5) * 1.5;
                
                targetShapeAttr[i * 3 + 0] = rTarget * Math.sin(theta) * Math.cos(phi);
                targetShapeAttr[i * 3 + 1] = rTarget * Math.sin(theta) * Math.sin(phi);
                targetShapeAttr[i * 3 + 2] = rTarget * Math.cos(theta);
            }

            const meshGeo = baseGeo.clone();
            meshGeo.setAttribute('aTargetShapeState', new THREE.BufferAttribute(targetShapeAttr, 3));
            
            const dummyScales = new Float32Array(baseCount).fill(1.0);
            const dummyOffsets = new Float32Array(baseCount * 3).fill(0.0);
            meshGeo.setAttribute('aSizeScale', new THREE.BufferAttribute(dummyScales, 1));
            meshGeo.setAttribute('aVolumetricOffset', new THREE.BufferAttribute(dummyOffsets, 3));

            return { meshGeo, pointsGeo: meshGeo };
        }

        // Тестовый слой лепестков для демонстрации архитектуры
        function addPetalRing(config = {}) {
            const count = config.count || 8;
            const radius = config.radius || 0.5;
            for (let i = 0; i < count; i++) {
                const seed = i * 7.93;
                const { meshGeo, pointsGeo } = createPetalGeometries(2.6, 2.2, seed);
                const angle = (i / count) * Math.PI * 2;
                
                const meshMat = createPetalMeshMat(seed, 1.0, 1.0, 1.0, config.tier || 0);
                const pointsMat = createPetalPointsMat(seed, 1.0, 1.0, 1.0, config.tier || 0);

                const createInstance = (group, mat, geo, isPoints) => {
                    const obj = isPoints ? new THREE.Points(geo, mat) : new THREE.Mesh(geo, mat);
                    const pivot = new THREE.Object3D();
                    pivot.rotation.y = angle;
                    obj.position.z = radius;
                    obj.rotation.x = 0.6;
                    pivot.add(obj);
                    group.add(pivot);
                };

                createInstance(meshGroup, meshMat, meshGeo, false);
                createInstance(pointsGroup, pointsMat, pointsGeo, true);
            }
        }

        addPetalRing({ count: 12, radius: 0.5, tier: 1.0 });

        // ==========================================
        // UI & MORPH INTERACTION
        // ==========================================
        const btnToggle = document.getElementById('btnToggle');
        const btnMorph = document.getElementById('btnMorph');

        function updateMode() {
            meshGroup.visible = !isPointsMode; 
            pointsGroup.visible = isPointsMode;
            btnToggle.classList.toggle('active', isPointsMode);
            btnToggle.innerText = isPointsMode ? 'POINTS MODE (M)' : 'MESH MODE (M)';
        }

        btnToggle.addEventListener('click', () => { isPointsMode = !isPointsMode; updateMode(); });
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm' || e.key === 'ь') { isPointsMode = !isPointsMode; updateMode(); } });
        
        btnMorph.addEventListener('click', () => {
            targetMorphState = targetMorphState === 0.0 ? 1.0 : 0.0;
            btnMorph.classList.toggle('active', targetMorphState > 0.5);
            btnMorph.innerText = targetMorphState > 0.5 ? 'MORPH: STATE B' : 'MORPH: STATE A';
        });

        updateMode();

        // ==========================================
        // ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const t = clock.getElapsedTime();

            // Плавная интерполяция морфинга (инерция стейтов)
            morphState += (targetMorphState - morphState) * dt * 2.5;

            allMaterials.forEach(mat => {
                if (mat.uniforms.uTime) mat.uniforms.uTime.value = t;
                if (mat.uniforms.uMorphProgress) mat.uniforms.uMorphProgress.value = morphState;
            });

            meshGroup.rotation.y = t * 0.03;
            pointsGroup.rotation.y = t * 0.03;

            renderer.render(scene, camera);
        }

        window.onload = animate;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeHud();
        });

        resizeHud();
    </script>
</body>
</html>
