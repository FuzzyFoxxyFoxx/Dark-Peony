<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000102">
    <meta name="color-scheme" content="dark">
    <title>Dark Peony Hub - Layout Assembly</title>
    <link rel="stylesheet" href="css/main.css?v=202610011505">
</head>
<body>

    <canvas id="hudCanvas"></canvas>

    <div id="ui">
        <button id="btnMorph" class="btn" type="button">MORPH (SPACE)</button>
        <button id="btnToggle" class="btn" type="button">POINTS MODE (M)</button>
    </div>
    <div id="ui-overlay">Dark Peony Hub • Layout Assembly</div>
    <div id="fatal" role="alert"></div>
    <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#d0e5ff">Для работы сайта нужен JavaScript.</div></noscript>

    <script>
        window.DP = window.DP || {};
        DP.showFatal = function (msg) {
            var el = document.getElementById('fatal');
            if (el) { el.textContent = msg; el.className = 'show'; }
        };
        window.addEventListener('error', function (e) {
            if (!window.THREE && e && e.target && e.target.tagName === 'SCRIPT') DP.showFatal('Не удалось загрузить графический движок. Обновите страницу.');
        }, true);
    </script>

    <!-- three.js r134 (MIT) лежит в репозитории: нет зависимости от CDN, работает и офлайн -->
    <script src="vendor/three.r134.min.js?v=202610011505"></script>

    <!-- ядро -->
    <script src="js/core/dp.js?v=202610011505"></script>
    <script src="js/core/morph.js?v=202610011505"></script>
    <script src="js/core/stage.js?v=202610011505"></script>
    <script src="js/core/flowsim.js?v=202610011505"></script>
    <script src="js/core/smokesim.js?v=202610011505"></script>
    <script src="js/core/orchestrator.js?v=202610011505"></script>

    <!-- фигуры: каждая — отдельный файл, регистрируется в DP.figures -->
    <script src="js/figures/peony.js?v=202610011505"></script>
    <script src="js/figures/jellyfish.js?v=202610011505"></script>
    <script src="js/figures/star.js?v=202610011505"></script>
    <script src="js/figures/seraph.js?v=202610011505"></script>

    <!-- запуск -->
    <script src="js/core/vision.js?v=202610011505"></script>
    <script src="js/main.js?v=202610011505"></script>
    <!-- ?tune — панель настройки морфинга: цикл, замедление, ползунки -->
    <script src="js/core/tune.js?v=202610011505"></script>
</body>
</html>
