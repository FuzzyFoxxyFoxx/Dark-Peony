<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Peony Hub - Morphing State Assembly</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000102; font-family: sans-serif; }
        
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        #hudCanvas {
            pointer-events: none;
            z-index: 5;
        }

        #webglCanvas {
            z-index: 1;
        }

        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(10, 20, 35, 0.75);
            border: 1px solid rgba(140, 180, 220, 0.4);
            color: #d0e5ff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(20, 40, 70, 0.9);
            border-color: #8cc0ff;
            box-shadow: 0 0 10px rgba(100, 180, 255, 0.3);
        }

        .btn.active {
            background: #255588;
            color: #ffffff;
            border-color: #aed5ff;
        }

        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(220, 235, 255, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(5, 10, 20, 0.6);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="hudCanvas"></canvas>

    <div id="ui">
        <button id="btnToggle" class="btn">POINTS MODE (M)</button>
        <button id="btnShape" class="btn">SHAPE: PEONY (S)</button>
    </div>
    <div id="ui-overlay">Dark Peony Hub • Orbital Morphing Engine</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <script>
        // ==========================================
        // UTILS & NOISE
        // ==========================================
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function noise(u, seed = 0) {
            return Math.sin(u * 7.3 + seed) * 0.4 + Math.sin(u * 17.1 + seed * 2.0) * 0.35 + Math.cos(u * 31.7 + seed * 0.5) * 0.25;
        }

        // ==========================================
        // 2D HUD
        // ==========================================
        const hudCanvas = document.getElementById('hudCanvas');
        const hudCtx = hudCanvas.getContext('2d');

        function resizeHud() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            hudCanvas.width = window.innerWidth * dpr;
            hudCanvas.height = window.innerHeight * dpr;
            hudCtx.scale(dpr, dpr);
            drawHud();
        }

        function drawHud() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            hudCtx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const R = Math.min(w, h) * 0.38 * 1.25;

            hudCtx.lineWidth = 1.5;

            hudCtx.strokeStyle = 'rgba(100, 160, 220, 0.35)';
            hudCtx.beginPath();
            hudCtx.arc(cx, cy, R, 0, Math.PI * 2);
            hudCtx.stroke();

            hudCtx.strokeStyle = 'rgba(80, 140, 200, 0.22)';
            hudCtx.beginPath();
            hudCtx.arc(cx, cy - R, R, 0, Math.PI * 2);
            hudCtx.stroke();

            hudCtx.beginPath();
            hudCtx.arc(cx, cy + R, R, 0, Math.PI * 2);
            hudCtx.stroke();

            const hGrad = hudCtx.createLinearGradient(0, cy, w, cy);
            hGrad.addColorStop(0.0, 'rgba(100, 170, 240, 0.0)');
            hGrad.addColorStop(0.2, 'rgba(100, 170, 240, 0.15)');
            hGrad.addColorStop(0.8, 'rgba(100, 170, 240, 0.15)');
            hGrad.addColorStop(1.0, 'rgba(100, 170, 240, 0.0)');
            hudCtx.strokeStyle = hGrad;
            hudCtx.beginPath();
            hudCtx.moveTo(0, cy); hudCtx.lineTo(w, cy);
            hudCtx.stroke();

            const vGrad = hudCtx.createLinearGradient(cx, 0, cx, h);
            vGrad.addColorStop(0.0, 'rgba(100, 170, 240, 0.0)');
            vGrad.addColorStop(0.15, 'rgba(100, 170, 240, 0.15)');
            vGrad.addColorStop(0.85, 'rgba(100, 170, 240, 0.15)');
            vGrad.addColorStop(1.0, 'rgba(100, 170, 240, 0.0)');
            hudCtx.strokeStyle = vGrad;
            hudCtx.beginPath();
            hudCtx.moveTo(cx, 0); hudCtx.lineTo(cx, h);
            hudCtx.stroke();

            const drawCross = (x, y, sz, col) => {
                hudCtx.strokeStyle = col;
                hudCtx.lineWidth = 2.5;
                hudCtx.beginPath();
                hudCtx.moveTo(x - sz, y); hudCtx.lineTo(x + sz, y);
                hudCtx.moveTo(x, y - sz); hudCtx.lineTo(x, y + sz);
                hudCtx.stroke();
            };

            const intersectOffsetX = R * Math.sin(Math.PI / 3);
            drawCross(cx - intersectOffsetX, cy - R * 0.5, 12, 'rgba(180, 220, 255, 0.85)');
            drawCross(cx + intersectOffsetX, cy - R * 0.5, 12, 'rgba(180, 220, 255, 0.85)');
            drawCross(cx - intersectOffsetX, cy + R * 0.5, 12, 'rgba(180, 220, 255, 0.85)');
            drawCross(cx + intersectOffsetX, cy + R * 0.5, 12, 'rgba(180, 220, 255, 0.85)');
        }

        // ==========================================
        // SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        
        camera.position.set(0, 5.6, 5.4);
        camera.lookAt(0, -0.48, 0);

        const oldCanvas = document.getElementById('webglCanvas');
        if (oldCanvas) oldCanvas.remove();

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false, 
            powerPreference: "high-performance",
            canvas: document.createElement('canvas') 
        });
        
        renderer.setClearColor(0x000102, 1.0);
        renderer.domElement.id = 'webglCanvas';
        document.body.appendChild(renderer.domElement);
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(pixelRatio);

        let isPointsMode = true;
        let targetShapeState = 0.0; // 0.0 = Peony, 1.0 = Mobius / Target State
        let currentMorphProgress = 0.0;

        function createParticleTexture() {
            const size = 128; 
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, 'rgba(255,255,255,1.0)');
            gradient.addColorStop(0.25, 'rgba(200,230,255,0.7)');
            gradient.addColorStop(0.5, 'rgba(100,170,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0.0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture();

        const pointsMaterialConfig = {
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            depthTest: true
        };

        const meshGroup = new THREE.Group();
        const pointsGroup = new THREE.Group();
        scene.add(meshGroup, pointsGroup);

        const allMaterials = [];

        function getViewportScale() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const effectiveDim = w >= h ? Math.min(w, h) : h;
            return effectiveDim * 0.0012;
        }

        // ==========================================
        // ФОНОВЫЕ ЧАСТИЦЫ
        // ==========================================
        const galaxyParticleCount = 900;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyParticleCount * 3);
        const galaxyScales = new Float32Array(galaxyParticleCount);

        for (let i = 0; i < galaxyParticleCount; i++) {
            const u = seededRandom(i * 1.5) * Math.PI * 2;
            const r = Math.pow(seededRandom(i * 2.3), 0.6) * 4.2;
            galaxyPositions[i * 3 + 0] = Math.cos(u) * r * 2.4;
            galaxyPositions[i * 3 + 1] = (seededRandom(i * 3.7) - 0.5) * 1.2 - 0.1;
            galaxyPositions[i * 3 + 2] = (seededRandom(i * 4.9) - 0.5) * 0.8 - 1.5;
            galaxyScales[i] = seededRandom(i * 4.1);
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeo.setAttribute('aSizeScale', new THREE.BufferAttribute(galaxyScales, 1));

        const galaxyMat = new THREE.ShaderMaterial({
            ...pointsMaterialConfig,
            uniforms: {
                uTexture: { value: particleTexture },
                uViewportScale: { value: getViewportScale() },
                uSize: { value: 3.5 },
                uTime: { value: 0 }
            },
            vertexShader: `
                uniform float uViewportScale, uSize, uTime;
                attribute float aSizeScale;
                varying float vAlpha;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    float dist = max(-mvPosition.z, 0.1);
                    gl_PointSize = uSize * uViewportScale * (0.8 + aSizeScale * 0.7) / (0.4 + 0.08 * dist);
                    vAlpha = 0.3 + 0.4 * aSizeScale;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture;
                varying float vAlpha;
                void main() {
                    vec4 tex = texture2D(uTexture, gl_PointCoord);
                    if (tex.a < 0.01) discard;
                    vec3 col = mix(vec3(0.1, 0.35, 0.7), vec3(0.7, 0.9, 1.0), tex.a);
                    gl_FragColor = vec4(col, tex.a * vAlpha * 0.25);
                }
            `
        });
        allMaterials.push(galaxyMat);
        scene.add(new THREE.Points(galaxyGeo, galaxyMat));

        // ==========================================
        // ЦВЕТОК & МОРФИНГ ОБРАЗЦЫ
        // ==========================================
        const FLOWER_SCALE = 0.72;
        meshGroup.scale.set(FLOWER_SCALE, FLOWER_SCALE, FLOWER_SCALE);
        pointsGroup.scale.set(FLOWER_SCALE, FLOWER_SCALE, FLOWER_SCALE);

        const FLOWER_Y_OFFSET = -0.55;
        meshGroup.position.y = FLOWER_Y_OFFSET;
        pointsGroup.position.y = FLOWER_Y_OFFSET;

        // Общие GLSL-блоки для морфинга с 360° орбитальным вихрем и иерархией срыва
        const morphUniforms = `
            uniform float uTime;
            uniform float uMorphProgress; // 0.0 -> 1.0
        `;

        const morphVertexPars = `
            uniform float uPhase;
            uniform float uAmpFactor;
            uniform float uFlexFactor;
            uniform float uSCurveStrength;
            uniform float uLayerTier;
            attribute vec3 aTargetPos;
            attribute float aSizeScale;
            attribute vec3 aVolumetricOffset;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec2 vUv;
            varying float vTier;
        `;

        // Функция математического преобразования с орбитальным вращением и иерархией срыва
        const morphVertexDisplacement = `
            vUv = uv;
            vTier = uLayerTier;
            vec3 pos = position;

            // Расчет базовой формы цветка с анимацией
            float hMask = smoothstep(0.01, 1.0, vUv.y);
            float vNorm = vUv.y; 
            float uNorm = (vUv.x - 0.5) * 2.0;

            float cupDeep = sin(vNorm * 3.14159 * 0.75) * 0.48 * uSCurveStrength;
            float tipOut  = -pow(vNorm, 2.1) * 0.38 * uSCurveStrength;
            float baseSCurve = cupDeep + tipOut;

            float ruffleMask = smoothstep(0.1, 1.0, vNorm) * (0.3 + 0.7 * abs(uNorm));
            float transverseSine = sin(uNorm * 12.56 + uPhase * 1.5) * 0.08 * ruffleMask;

            float effectiveAmp = uAmpFactor * uFlexFactor;
            float whip = pow(vNorm, 1.25) * effectiveAmp;
            float wave1 = sin(uTime * 0.85 - vNorm * 3.8 + uPhase) * 0.35 * whip;
            float wave2 = cos(uTime * 0.62 - vNorm * 5.2 + uPhase * 1.7) * 0.18 * whip;
            float edgeDist = abs(vUv.x - 0.5) * 2.0;
            float edgeFlutter = sin(uTime * 1.1 + vUv.x * 6.28 + uPhase) * 0.10 * edgeDist * whip;

            pos.z += baseSCurve + transverseSine + (wave1 + wave2 + edgeFlutter) * hMask;
            pos += aVolumetricOffset * (0.005 + 0.012 * smoothstep(0.0, 0.3, vNorm));

            vec3 peonyPos = pos;
            vec3 targetP = aTargetPos;

            // Иерархия срыва: края и кончики срываются первыми (vNorm и edgeDist), основание отстает
            float edgeFactor = clamp(vNorm * 0.7 + edgeDist * 0.3, 0.0, 1.0);
            float delayProgress = smoothstep(0.0, 0.75, uMorphProgress * (0.6 + 0.4 * edgeFactor));

            // Орбитальное 360° вращение во время промежуточной фазы разлета
            float spinAngle = sin(uMorphProgress * 3.14159) * 6.28318 * (1.1 - edgeFactor * 0.4);
            float cosS = cos(spinAngle);
            float sinS = sin(spinAngle);
            
            vec3 intermediatePos = mix(peonyPos, targetP, delayProgress);
            
            // Применяем орбитальный вихрь вокруг оси Y в момент транзита
            float xRot = intermediatePos.x * cosS - intermediatePos.z * sinS;
            float zRot = intermediatePos.x * sinS + intermediatePos.z * cosS;
            intermediatePos.x = xRot;
            intermediatePos.z = zRot;

            pos = mix(peonyPos, intermediatePos, smoothstep(0.0, 1.0, uMorphProgress));
        `;

        // Генерация целевых координат для морфинга (например, лента Мебиуса / орбитальная спираль)
        function generateTargetPosition(baseX, baseY, baseZ, seed, index, total) {
            // Создаем красивую математическую форму (орбитальная спираль / лента Мебиуса)
            const u = (index / total) * Math.PI * 4.0;
            const v = seededRandom(seed * 1.7) * 0.8 - 0.4;
            const r = 1.8 + v * 0.5;
            
            const tx = Math.cos(u) * r;
            const ty = Math.sin(u * 0.5) * 1.2 + (seededRandom(seed * 2.1) - 0.5) * 0.5;
            const tz = Math.sin(u) * r;
            
            return new THREE.Vector3(tx, ty, tz);
        }

        function createPetalMeshMat(pSeed, amp, flex, sStr, tier) {
            const mat = new THREE.ShaderMaterial({
                uniforms: { 
                    uTime: {value:0}, uPhase: {value:pSeed}, uAmpFactor: {value:amp}, 
                    uFlexFactor: {value:flex}, uSCurveStrength: {value:sStr}, uLayerTier: {value:tier},
                    uMorphProgress: {value: 0.0} 
                },
                vertexShader: `
                    ${morphUniforms}
                    ${morphVertexPars}
                    void main() {
                        ${morphVertexDisplacement}
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        vViewPosition = -mvPosition.xyz;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal, vViewPosition;
                    varying vec2 vUv;
                    varying float vTier;
                    void main() {
                        vec3 N = gl_FrontFacing ? normalize(vNormal) : -normalize(vNormal);
                        vec3 V = normalize(vViewPosition);
                        float fresnel = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), 1.5);
                        float rimBoost = 1.0 + vTier * 0.6;
                        vec3 color = mix(vec3(0.02, 0.05, 0.1), vec3(0.75, 0.9, 1.0), fresnel * 1.2 * rimBoost);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide, depthWrite: true, depthTest: true
            });
            allMaterials.push(mat); return mat;
        }

        function createPetalPointsMat(pSeed, amp, flex, sStr, tier) {
            const mat = new THREE.ShaderMaterial({
                ...pointsMaterialConfig,
                uniforms: { 
                    uTime: {value:0}, uPhase: {value:pSeed}, uAmpFactor: {value:amp}, 
                    uFlexFactor: {value:flex}, uSCurveStrength: {value:sStr}, uLayerTier: {value:tier},
                    uTexture: {value:particleTexture}, uViewportScale: {value:getViewportScale()}, uSize: {value: 2.2},
                    uMorphProgress: {value: 0.0} 
                },
                vertexShader: `
                    ${morphUniforms}
                    ${morphVertexPars}
                    uniform float uViewportScale, uSize;
                    varying float vAlpha, vFresnel, vHeight;
                    void main() {
                        ${morphVertexDisplacement}
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        float dist = max(-mvPosition.z, 0.1);

                        vec3 N = normalize(normalMatrix * normal);
                        vec3 V = normalize(-mvPosition.xyz);
                        vFresnel = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), 1.3);
                        vHeight = vUv.y;

                        float depthCompensation = 1.0 / (0.35 + 0.06 * dist);
                        float tierScaleBonus = 1.0 + vTier * 0.2; 
                        float sScale = (0.7 + aSizeScale * 0.5) * depthCompensation * tierScaleBonus; 
                        gl_PointSize = uSize * uViewportScale * sScale;

                        vAlpha = (0.2 + 0.5 * vFresnel) * (0.3 + 0.7 * smoothstep(0.0, 0.35, vUv.y));
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying float vAlpha, vFresnel, vHeight;
                    varying float vTier;
                    void main() {
                        vec4 tex = texture2D(uTexture, gl_PointCoord);
                        if (tex.a < 0.01) discard;

                        vec3 color = mix(vec3(0.04, 0.1, 0.2), vec3(0.7, 0.88, 1.0), vFresnel * 1.1);
                        float edgeGlow = smoothstep(0.2, 0.9, vHeight) * 1.5;
                        float radialMultiplier = 1.0 + edgeGlow;

                        float finalAlpha = tex.a * vAlpha * 0.20 * radialMultiplier;
                        finalAlpha = finalAlpha / (0.45 + finalAlpha * 2.2);

                        gl_FragColor = vec4(color, finalAlpha);
                    }
                `
            });
            allMaterials.push(mat); return mat;
        }

        // Генерация геометрии лепестка с атрибутами целевых позиций
        function createPetalGeometries(length, maxWidth, seed) {
            const segX = 100, segY = 100;
            const baseGeo = new THREE.PlaneGeometry(maxWidth, length, segX, segY);
            baseGeo.translate(0, length / 2, 0);
            const posAttr = baseGeo.attributes.position;
            const baseCount = posAttr.count;

            for (let i = 0; i < baseCount; i++) {
                let x = posAttr.getX(i), y = posAttr.getY(i);
                let u = x / (maxWidth / 2);
                let arch = Math.sqrt(Math.max(0.0, 1.0 - Math.pow(u * 0.95, 2)));
                let organicEdge = noise(u, seed) * 0.12 * Math.pow(Math.abs(u), 0.3);
                let maxAllowedHeight = length * (0.35 + 0.65 * arch) + organicEdge;
                if (y > maxAllowedHeight || isNaN(y)) y = maxAllowedHeight;
                let realV = y / length;
                x *= (0.22 + 0.78 * Math.pow(Math.max(0.0, realV), 0.42) * (1.0 + Math.sin(u * 3.5 + seed) * 0.05));
                let cupCross = Math.cos(u * Math.PI * 0.5) * 0.14 * Math.sin(realV * Math.PI * 0.85);
                posAttr.setXYZ(i, x, y, cupCross);
            }
            baseGeo.computeVertexNormals();

            const meshGeo = baseGeo.clone();
            const normAttr = baseGeo.attributes.normal;
            const uvAttr = baseGeo.attributes.uv;
            
            const multiplier = 3; 
            const totalPoints = baseCount * multiplier;

            const pPositions = new Float32Array(totalPoints * 3);
            const pTargetPositions = new Float32Array(totalPoints * 3);
            const pNormals = new Float32Array(totalPoints * 3);
            const pUvs = new Float32Array(totalPoints * 2);
            const pSizeScales = new Float32Array(totalPoints);
            const pVolOffsets = new Float32Array(totalPoints * 3);

            for (let i = 0; i < baseCount; i++) {
                const bx = posAttr.getX(i), by = posAttr.getY(i), bz = posAttr.getZ(i);
                const nx = normAttr.getX(i), ny = normAttr.getY(i), nz = normAttr.getZ(i);
                const uvU = uvAttr.getX(i), uvV = uvAttr.getY(i);

                for (let m = 0; m < multiplier; m++) {
                    const pIdx = i * multiplier + m;
                    const subSeed = seed + pIdx * 0.137;
                    const offsetX = (seededRandom(subSeed) - 0.5) * (maxWidth / segX) * 0.8;
                    const offsetY = (seededRandom(subSeed + 1.0) - 0.5) * (length / segY) * 0.8;

                    const px = bx + offsetX;
                    const py = by + offsetY;
                    const pz = bz;

                    pPositions[pIdx * 3 + 0] = px;
                    pPositions[pIdx * 3 + 1] = py;
                    pPositions[pIdx * 3 + 2] = pz;

                    // Генерация целевой точки для морфинга
                    const target = generateTargetPosition(px, py, pz, subSeed, pIdx, totalPoints);
                    pTargetPositions[pIdx * 3 + 0] = target.x;
                    pTargetPositions[pIdx * 3 + 1] = target.y;
                    pTargetPositions[pIdx * 3 + 2] = target.z;

                    pNormals[pIdx * 3 + 0] = nx;
                    pNormals[pIdx * 3 + 1] = ny;
                    pNormals[pIdx * 3 + 2] = nz;
                    pUvs[pIdx * 2 + 0] = uvU;
                    pUvs[pIdx * 2 + 1] = uvV;
                    pSizeScales[pIdx] = Math.max(0.0, seededRandom(subSeed + 2.0));
                    pVolOffsets[pIdx * 3 + 0] = (seededRandom(subSeed + 3.0) - 0.5) * 0.015;
                    pVolOffsets[pIdx * 3 + 1] = (seededRandom(subSeed + 4.0) - 0.5) * 0.015;
                    pVolOffsets[pIdx * 3 + 2] = (seededRandom(subSeed + 5.0) - 0.5) * 0.025;
                }
            }

            const pointsGeo = new THREE.BufferGeometry();
            pointsGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            pointsGeo.setAttribute('aTargetPos', new THREE.BufferAttribute(pTargetPositions, 3));
            pointsGeo.setAttribute('normal', new THREE.BufferAttribute(pNormals, 3));
            pointsGeo.setAttribute('uv', new THREE.BufferAttribute(pUvs, 2));
            pointsGeo.setAttribute('aSizeScale', new THREE.BufferAttribute(pSizeScales, 1));
            pointsGeo.setAttribute('aVolumetricOffset', new THREE.BufferAttribute(pVolOffsets, 3));

            // Для сетки (Mesh) тоже добавляем target-атрибут
            const mTargetPositions = new Float32Array(baseCount * 3);
            for(let i=0; i<baseCount; i++) {
                const px = posAttr.getX(i), py = posAttr.getY(i), pz = posAttr.getZ(i);
                const t = generateTargetPosition(px, py, pz, seed + i*0.01, i, baseCount);
                mTargetPositions[i*3] = t.x;
                mTargetPositions[i*3+1] = t.y;
                mTargetPositions[i*3+2] = t.z;
            }
            meshGeo.setAttribute('aTargetPos', new THREE.BufferAttribute(mTargetPositions, 3));
            meshGeo.setAttribute('aSizeScale', new THREE.BufferAttribute(new Float32Array(baseCount).fill(1.0), 1));
            meshGeo.setAttribute('aVolumetricOffset', new THREE.BufferAttribute(new Float32Array(baseCount * 3).fill(0.0), 3));

            return { meshGeo, pointsGeo };
        }

        function addPetalRing(config = {}) {
            const count = config.count || 8;
            const radius = config.radius || 0.5;
            const baseAmp = config.ampFactor !== undefined ? config.ampFactor : 1.0;
            const baseLen = config.length || 2.6;
            const baseWidth = config.maxWidth || 2.2;
            const tier = config.tier || 0.0;

            for (let i = 0; i < count; i++) {
                const seed = (config.layerSeed || 1.0) * 137.5 + i * 7.93;
                const isFeatured = seededRandom(seed * 1.1) > 0.62;
                const scaleBoost = isFeatured ? (1.22 + seededRandom(seed * 2.3) * 0.15) : (0.95 + seededRandom(seed * 3.1) * 0.16);
                const finalLength = baseLen * scaleBoost;
                const finalWidth = baseWidth * scaleBoost;
                const flexFactor = isFeatured ? (1.25 + seededRandom(seed * 4.2) * 0.20) : (0.90 + seededRandom(seed * 5.1) * 0.20);
                const sCurveProfile = 0.85 + seededRandom(seed * 6.3) * 0.45;

                const { meshGeo, pointsGeo } = createPetalGeometries(finalLength, finalWidth, seed);
                const angleOffset = (seededRandom(seed * 7.4) - 0.5) * (Math.PI / count) * 0.55;
                const angle = (i / count) * Math.PI * 2 + (config.phaseOffset || 0) + angleOffset;
                const baseTilt = (config.baseTilt || 0.6) + (seededRandom(seed * 8.2) - 0.5) * 0.14;
                const rollVar = (seededRandom(seed * 9.1) - 0.5) * 0.12;
                const finalRadius = radius + (seededRandom(seed * 10.3) - 0.5) * 0.08;

                const meshMat = createPetalMeshMat(seed * 0.5, baseAmp, flexFactor, sCurveProfile, tier);
                const pointsMat = createPetalPointsMat(seed * 0.5, baseAmp, flexFactor, sCurveProfile, tier);

                const createInstance = (group, mat, geo, isPoints) => {
                    const obj = isPoints ? new THREE.Points(geo, mat) : new THREE.Mesh(geo, mat);
                    const pivot = new THREE.Object3D();
                    pivot.rotation.y = angle;
                    pivot.position.y = config.yOffset || 0;
                    obj.position.z = finalRadius;
                    obj.rotation.x = baseTilt;
                    obj.rotation.z = rollVar;
                    pivot.add(obj);
                    group.add(pivot);
                };

                createInstance(meshGroup, meshMat, meshGeo, false);
                createInstance(pointsGroup, pointsMat, pointsGeo, true);
            }
        }

        const RECEPTACLE_RADIUS = 0.48;
        addPetalRing({ count: 8, radius: RECEPTACLE_RADIUS * 0.82, yOffset: -0.22, baseTilt: 0.20, length: 2.1, maxWidth: 1.6, layerSeed: 1, ampFactor: 0.40, tier: 0.0 });
        addPetalRing({ count: 12, radius: RECEPTACLE_RADIUS * 1.05, yOffset: -0.28, baseTilt: 0.55, length: 2.5, maxWidth: 2.0, phaseOffset: Math.PI / 12, layerSeed: 2, ampFactor: 0.75, tier: 1.0 });
        addPetalRing({ count: 16, radius: RECEPTACLE_RADIUS * 1.32, yOffset: -0.36, baseTilt: 0.92, length: 3.0, maxWidth: 2.5, phaseOffset: Math.PI / 16, layerSeed: 3, ampFactor: 1.20, tier: 2.0 });

        // Создание тентаклей и тычинок с поддержкой морфинга
        function createSymmetricTentacleGeo(height, baseRadius, seed, flareAmount) {
            const points = [];
            const segments = 90;
            for (let s = 0; s <= segments; s++) {
                const t = s / segments;
                points.push(new THREE.Vector3(Math.pow(t, 0.7)*flareAmount, t*height, Math.sin(t*Math.PI*1.6+seed)*0.15*t));
            }
            const path = new THREE.CatmullRomCurve3(points);
            const radialSegments = 16;
            const geo = new THREE.BufferGeometry();
            const posArray = [], targetArray = [], normArray = [], uvArray = [], seedArray = [];

            let vCounter = 0;
            for (let i = 0; i <= segments; i++) {
                const v = i / segments;
                const point = path.getPointAt(v);
                const radius = baseRadius * Math.max(0.08, Math.pow(1.0 - v * 0.88, 1.1));
                for (let j = 0; j <= radialSegments; j++) {
                    const u = j / radialSegments;
                    const theta = u * Math.PI * 2;
                    const nx = Math.cos(theta), nz = Math.sin(theta);
                    
                    const px = point.x + nx * radius;
                    const py = point.y;
                    const pz = point.z + nz * radius;

                    posArray.push(px, py, pz);

                    const target = generateTargetPosition(px, py, pz, seed + vCounter * 0.05, vCounter, (segments+1)*(radialSegments+1));
                    targetArray.push(target.x, target.y, target.z);

                    normArray.push(nx, 0, nz);
                    uvArray.push(u, v);
                    seedArray.push(seed);
                    vCounter++;
                }
            }

            const indices = [];
            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < radialSegments; j++) {
                    const a = i * (radialSegments + 1) + j;
                    const b = (i + 1) * (radialSegments + 1) + j;
                    const c = (i + 1) * (radialSegments + 1) + (j + 1);
                    const d = i * (radialSegments + 1) + (j + 1);
                    indices.push(a, b, d, b, c, d);
                }
            }
            geo.setIndex(indices);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
            geo.setAttribute('aTargetPos', new THREE.Float32BufferAttribute(targetArray, 3));
            geo.setAttribute('normal', new THREE.Float32BufferAttribute(normArray, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvArray, 2));
            geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(seedArray, 1));
            return geo;
        }

        const tentVertexPars = `uniform float uTime; uniform float uMorphProgress; attribute float aSeed; attribute vec3 aTargetPos; varying vec3 vNormal, vViewPosition; varying vec2 vUv;`;
        const tentVertexDisplacement = `
            vUv = uv; vec3 pos = position; float whip = pow(vUv.y, 1.3);
            float t1 = uTime * 1.2 - pos.y * 1.5 + aSeed * 9.1;
            float t2 = uTime * 0.9 - pos.y * 2.1 + aSeed * 4.3;
            pos.x += (sin(t1) * 0.25 + cos(t2) * 0.12) * whip;
            pos.z += (cos(t1 * 0.85) * 0.25 + sin(t2 * 1.1) * 0.12) * whip;

            vec3 peonyP = pos;
            float edgeFactor = clamp(vUv.y, 0.0, 1.0);
            float delayP = smoothstep(0.0, 0.8, uMorphProgress * (0.5 + 0.5 * edgeFactor));
            float spinA = sin(uMorphProgress * 3.14159) * 6.28318;
            vec3 interP = mix(peonyP, aTargetPos, delayP);
            
            float xR = interP.x * cos(spinA) - interP.z * sin(spinA);
            float zR = interP.x * sin(spinA) + interP.z * cos(spinA);
            interP.x = xR; interP.z = zR;

            pos = mix(peonyP, interP, smoothstep(0.0, 1.0, uMorphProgress));
        `;

        const tentMeshMat = new THREE.ShaderMaterial({
            uniforms: { uTime: {value:0}, uMorphProgress: {value:0} },
            vertexShader: `${tentVertexPars} void main(){ ${tentVertexDisplacement} vec4 mv=modelViewMatrix*vec4(pos,1.); vViewPosition=-mv.xyz; vNormal=normalize(normalMatrix*normal); gl_Position=projectionMatrix*mv; }`,
            fragmentShader: `
                varying vec3 vNormal, vViewPosition;
                varying vec2 vUv;
                void main(){ 
                    vec3 N = gl_FrontFacing ? normalize(vNormal) : -normalize(vNormal); 
                    float fresnel = pow(clamp(1.0 - abs(dot(N, normalize(vViewPosition))), 0.0, 1.0), 1.2); 
                    float baseFade = smoothstep(0.05, 0.3, vUv.y);
                    float edgeFade = 1.0 - smoothstep(0.85, 1.0, vUv.y);
                    float alpha = 0.5 * baseFade * edgeFade;
                    vec3 baseColor = mix(vec3(0.06, 0.14, 0.25), vec3(0.5, 0.7, 0.9), fresnel * 1.1);
                    vec3 tipColor = vec3(0.4, 0.7, 0.95);
                    gl_FragColor = vec4(mix(baseColor, tipColor, smoothstep(0.4, 0.85, vUv.y)), alpha); 
                }
            `,
            side: THREE.DoubleSide, depthWrite: false, transparent: true
        });
        allMaterials.push(tentMeshMat);

        const tentPointsMat = new THREE.ShaderMaterial({
            ...pointsMaterialConfig,
            depthTest: false,
            uniforms: { uTime: { value: 0 }, uMorphProgress: { value: 0 }, uTexture: { value: particleTexture }, uViewportScale: { value: getViewportScale() }, uSize: { value: 2.0 } },
            vertexShader: `
                ${tentVertexPars} uniform float uViewportScale, uSize; varying float vFresnel;
                void main(){ ${tentVertexDisplacement} vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                float dist = max(-mv.z, 0.1); gl_PointSize = uSize * uViewportScale * (0.85 / (0.4 + 0.06 * dist));
                vFresnel = pow(clamp(1.0 - abs(dot(normalize(normalMatrix * normal), normalize(-mv.xyz))), 0.0, 1.0), 1.2); 
                gl_Position = projectionMatrix * mv; }
            `,
            fragmentShader: `
                uniform sampler2D uTexture; varying float vFresnel; varying vec2 vUv;
                void main(){ vec4 tex = texture2D(uTexture, gl_PointCoord); if(tex.a < 0.02) discard; 
                float baseFade = smoothstep(0.05, 0.3, vUv.y);
                float edgeFade = 1.0 - smoothstep(0.85, 1.0, vUv.y);
                float tipGlow = smoothstep(0.1, 0.85, vUv.y) * 1.4;
                float a = tex.a * (0.12 + tipGlow * 0.2) * baseFade * edgeFade; 
                vec3 baseColor = mix(vec3(0.1, 0.22, 0.38), vec3(0.7, 0.85, 1.0), vFresnel * 1.1);
                gl_FragColor = vec4(mix(baseColor, vec3(0.4, 0.7, 0.95), smoothstep(0.4, 0.85, vUv.y)), a / (0.45 + a * 1.2)); }
            `
        });
        allMaterials.push(tentPointsMat);

        // Добавление тентаклей
        const outerTentacleCount = 8;
        const outerRadius = 0.42;
        const baseHeight = 5.2;

        for (let i = 0; i < outerTentacleCount; i++) {
            const seed = i * 2.71 + 1.2;
            const height = baseHeight + Math.sin(seed) * 0.4;
            const geo = createSymmetricTentacleGeo(height, 0.07, seed, 0.95);
            const angle = (i / outerTentacleCount) * Math.PI * 2;

            const createT = (gr, mat, isP) => {
                const m = isP ? new THREE.Points(geo, mat) : new THREE.Mesh(geo, mat);
                m.position.set(Math.sin(angle)*outerRadius, -0.25, Math.cos(angle)*outerRadius);
                m.rotation.y = angle; gr.add(m);
            };
            createT(meshGroup, tentMeshMat, false);
            createT(pointsGroup, tentPointsMat, true);
        }

        const coreHeights = [baseHeight * 1.34, baseHeight * 1.27, baseHeight * 1.39];
        for (let i = 0; i < 3; i++) {
            const seed = i * 5.13 + 8.4;
            const height = coreHeights[i];
            const geo = createSymmetricTentacleGeo(height, 0.075, seed, 0.45);
            const angle = (i / 3) * Math.PI * 2 + 0.5;
            const coreRadius = 0.12;

            const createT = (gr, mat, isP) => {
                const m = isP ? new THREE.Points(geo, mat) : new THREE.Mesh(geo, mat);
                m.position.set(Math.sin(angle)*coreRadius, -0.25, Math.cos(angle)*coreRadius);
                m.rotation.y = angle; gr.add(m);
            };
            createT(meshGroup, tentMeshMat, false);
            createT(pointsGroup, tentPointsMat, true);
        }

        // Цветоложе (Receptacle) с поддержкой морфинга
        const receptacleGeo = new THREE.SphereGeometry(RECEPTACLE_RADIUS, 32, 32);
        const recepPosAttr = receptacleGeo.attributes.position;
        const recepTargetPos = new Float32Array(recepPosAttr.count * 3);
        for(let i=0; i<recepPosAttr.count; i++) {
            let px = recepPosAttr.getX(i), py = recepPosAttr.getY(i), pz = recepPosAttr.getZ(i);
            py *= 0.55;
            const t = generateTargetPosition(px, py, pz, i * 0.3, i, recepPosAttr.count);
            recepTargetPos[i*3] = t.x; recepTargetPos[i*3+1] = t.y; recepTargetPos[i*3+2] = t.z;
        }
        receptacleGeo.setAttribute('aTargetPos', new THREE.BufferAttribute(recepTargetPos, 3));

        const recepVertexPars = `uniform float uTime; uniform float uMorphProgress; attribute vec3 aTargetPos; varying vec3 vNormal, vViewPosition;`;
        const recepVertexDisplacement = `
            vec3 norm = normalize(position);
            float wave = (sin(norm.x*2.5+uTime*0.9)*cos(norm.y*2.0+uTime*0.7) + cos(norm.z*2.8-uTime*0.8)*sin(norm.y*3.1+uTime*0.5)) * 0.06;
            vec3 pos = position + norm * wave; pos.y *= 0.55;
            vec3 peonyP = pos;
            vec3 interP = mix(peonyP, aTargetPos, smoothstep(0.0, 1.0, uMorphProgress));
            float spinA = sin(uMorphProgress * 3.14159) * 6.28318;
            float xR = interP.x * cos(spinA) - interP.z * sin(spinA);
            float zR = interP.x * sin(spinA) + interP.z * cos(spinA);
            interP.x = xR; interP.z = zR;
            pos = mix(peonyP, interP, uMorphProgress);
        `;

        const recepMeshMat = new THREE.ShaderMaterial({
            uniforms: { uTime: {value:0}, uMorphProgress: {value:0} },
            vertexShader: `${recepVertexPars} void main(){ ${recepVertexDisplacement} vec4 mv=modelViewMatrix*vec4(pos,1.); vViewPosition=-mv.xyz;
            vec3 tN=normal; tN.y/=0.55; vNormal=normalize(normalMatrix*tN); gl_Position=projectionMatrix*mv; }`,
            fragmentShader: `varying vec3 vNormal, vViewPosition; void main(){ vec3 N = normalize(vNormal); float fresnel = pow(clamp(1.-abs(dot(N, normalize(vViewPosition))),0.,1.), 2.0); gl_FragColor = vec4(mix(vec3(0.02, 0.05, 0.1), vec3(0.6, 0.75, 0.95), fresnel), 0.8); }`,
            transparent: true
        });
        allMaterials.push(recepMeshMat);

        const recepPointsMat = new THREE.ShaderMaterial({
            ...pointsMaterialConfig,
            uniforms: { uTime: {value:0}, uMorphProgress: {value:0}, uTexture: {value:particleTexture}, uViewportScale: {value:getViewportScale()}, uSize: {value: 2.0} },
            vertexShader: `
                ${recepVertexPars} uniform float uViewportScale, uSize; void main(){ ${recepVertexDisplacement} vec4 mv=modelViewMatrix*vec4(pos,1.); gl_Position=projectionMatrix*mv;
                float dist=max(-mv.z, 0.1); gl_PointSize=uSize*uViewportScale*(0.85 / (0.35 + 0.06 * dist));
                vec3 tN=normal; tN.y/=0.55; vNormal=normalize(normalMatrix*tN); vViewPosition=-mv.xyz; }`,
            fragmentShader: `uniform sampler2D uTexture; varying vec3 vNormal, vViewPosition; void main(){ vec4 tex=texture2D(uTexture,gl_PointCoord); if(tex.a<0.02)discard; vec3 N = normalize(vNormal); float fresnel = pow(clamp(1.-abs(dot(N, normalize(vViewPosition))),0.,1.), 2.0); float a = tex.a * 0.18; gl_FragColor = vec4(mix(vec3(0.03, 0.08, 0.16), vec3(0.6, 0.75, 0.95), fresnel), a / (0.5 + a * 2.0)); }`
        });
        allMaterials.push(recepPointsMat);

        const recepMeshObj = new THREE.Mesh(receptacleGeo, recepMeshMat);
        recepMeshObj.position.y = -0.25;
        meshGroup.add(recepMeshObj);

        const recepPointsObj = new THREE.Points(receptacleGeo, recepPointsMat);
        recepPointsObj.position.y = -0.25;
        pointsGroup.add(recepPointsObj);

        // ==========================================
        // UI & TOGGLE LOGIC
        // ==========================================
        const btnToggle = document.getElementById('btnToggle');
        const btnShape = document.getElementById('btnShape');
        const uiOverlay = document.getElementById('ui-overlay');

        function updateMode() {
            meshGroup.visible = !isPointsMode; 
            pointsGroup.visible = isPointsMode;
            btnToggle.classList.toggle('active', isPointsMode);
            btnToggle.innerText = isPointsMode ? 'POINTS MODE (M)' : 'MESH MODE (M)';
        }

        btnToggle.addEventListener('click', () => { isPointsMode = !isPointsMode; updateMode(); });
        
        btnShape.addEventListener('click', () => {
            targetShapeState = targetShapeState === 0.0 ? 1.0 : 0.0;
            btnShape.classList.toggle('active', targetShapeState === 1.0);
            btnShape.innerText = targetShapeState === 1.0 ? 'SHAPE: MÖBIUS (S)' : 'SHAPE: PEONY (S)';
            uiOverlay.innerText = targetShapeState === 1.0 ? 'Dark Peony Hub • Morphing to Mӧbius Field' : 'Dark Peony Hub • Assembling Dark Peony';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'm' || e.key === 'ь') { isPointsMode = !isPointsMode; updateMode(); }
            if (e.key.toLowerCase() === 's' || e.key === 'ы') { btnShape.click(); }
        });
        updateMode();

        // ==========================================
        // ANIMATION LOOP & MORPHING INTERPOLATION
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const t = clock.getElapsedTime();

            // Плавная интерполяция прогресса морфинга (Lerp к целевому состоянию)
            const morphSpeed = 1.2;
            currentMorphProgress += (targetShapeState - currentMorphProgress) * dt * morphSpeed;

            allMaterials.forEach(mat => {
                if (mat.uniforms.uTime) mat.uniforms.uTime.value = t;
                if (mat.uniforms.uMorphProgress) mat.uniforms.uMorphProgress.value = currentMorphProgress;
            });

            // Плавное вращение всей системы
            const baseRotSpeed = 0.03;
            const morphRotBoost = 1.0 + currentMorphProgress * 0.5;
            meshGroup.rotation.y = t * baseRotSpeed * morphRotBoost;
            pointsGroup.rotation.y = t * baseRotSpeed * morphRotBoost;

            renderer.render(scene, camera);
        }

        window.onload = animate;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            const pr = Math.min(window.devicePixelRatio || 1, 2);
            renderer.setPixelRatio(pr);
            
            const newViewportScale = getViewportScale();
            allMaterials.forEach(mat => { 
                if(mat.uniforms.uViewportScale) mat.uniforms.uViewportScale.value = newViewportScale; 
            });
            resizeHud();
        });

        resizeHud();
    </script>
</body>
</html>
